<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Events Radar — Карта</title>
  <link rel="stylesheet" href="css/normalize.min.css">
<link rel="stylesheet" href="css/style.min.css">
</head>
<body>

  <header class="app-header">
    <div class="logo">Events<span>Radar</span></div>
    <div class="app-header__actions">
      <button class="icon-btn" type="button" aria-label="Профиль">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="map-screen">
      <div class="map-filters">
        <button class="chip active" type="button">Категория</button>
        <button class="chip" type="button">Дата</button>
        <button class="chip" type="button">Цена</button>
        <button class="chip" type="button">Расстояние</button>
      </div>

      <div class="map-pin p1">12</div>
      <div class="map-pin cluster p2">5</div>
      <div class="map-pin p3">3</div>

      <div class="bottom-sheet">
        <div class="bottom-sheet__handle"></div>
        <article class="event-card" style="border:none; box-shadow:none;">
          <div class="event-card__body" style="padding:0;">
            <span class="event-card__cat" style="position:static; display:inline-block; background:var(--accent); color:#fff; margin-bottom:.5rem;">Квартирник</span>
            <h3 class="event-card__title">Акустический вечер у Маши</h3>
            <p class="event-card__meta">12 окт, 19:00 · 2.3 км</p>
            <div class="event-card__foot">
              <span class="event-card__price free">Бесплатно</span>
              <button class="btn-go" type="button">Пойду</button>
            </div>
          </div>
        </article>
      </div>
    </section>
  </main>

  <nav class="tabbar">
    <a href="index.html">
      <svg viewBox="0 0 24 24"><path d="M3 12l9-9 9 9v9a2 2 0 01-2 2h-4v-7h-6v7H5a2 2 0 01-2-2z"/></svg>
      Лента
    </a>
    <a href="map.html" class="active">
      <svg viewBox="0 0 24 24"><path d="M9 20l-5.5-2.5V4L9 6.5 15 4l5.5 2.5V20L15 17.5 9 20z"/><path d="M9 6.5v13M15 4v13"/></svg>
      Карта
    </a>
    <a href="#" class="create" aria-label="Создать событие">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
      Календарь
    </a>
    <a href="#">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>
      Профиль
    </a>
  </nav>

  <script src="js/main.min.js"></script>
</body>
</html>
